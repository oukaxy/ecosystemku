<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0c0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kronik">
<title>Kronik — Jurnal & Legenda</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── ROOT VARS ──────────────────────────────────────────────────────────── */
:root {
  /* RPG / dark gold vars */
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #7a5f28;
  --rpg-bg: #0d0c0a;
  --rpg-parchment: #1a1710;
  --rpg-parchment2: #211f18;
  --rpg-text: #d4c89a;
  --rpg-text-dim: #7a7055;
  --red: #c94c4c;
  --blue: #4c7ec9;
  --green: #5aaa6a;
  --purple: #9c6ec9;
  --orange: #c97c4c;

  /* Journal / parchment vars */
  --ink: #3a2510;
  --ink-mid: rgba(80,50,20,0.55);
  --ink-light: rgba(80,50,20,0.35);
  --j-gold: #c8a050;
  --j-gold-dim: rgba(200,160,80,0.45);
  --rule: rgba(160,120,70,0.18);
  --margin-line: rgba(210,120,120,0.22);
  --paper-light: #f6edda;
  --paper-dark: #efe3c6;

  /* Active tab */
  --active-tab: journal;
}

/* ── BASE ──────────────────────────────────────────────────────────────── */
html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body {
  font-family: 'Lora', Georgia, serif;
  transition: background 0.6s ease, color 0.6s ease;
}

body.tab-journal {
  background: radial-gradient(ellipse at 50% 0%, #1c1008 0%, #080503 100%);
  color: var(--ink);
}

/* Grain overlay */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}


/* ── TAB PANELS ─────────────────────────────────────────────────────────── */
.tab-panel {
  position: fixed; inset: 0;
  overflow: hidden;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.tab-panel.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
}

/* ═══════════════════════════════════════════════════════════════════════
   JOURNAL PANEL
═══════════════════════════════════════════════════════════════════════ */
#panel-journal {
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* ── Ambient glow ── */
.ambient {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; height: 60%; pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,150,60,0.08) 0%, transparent 70%);
  transition: opacity 0.6s;
  z-index: 0;
}

/* inner screens within journal panel */
.j-screen {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.45s ease;
}
.j-screen.hidden { opacity: 0; pointer-events: none; }

#cover-screen { flex-direction: column; gap: 20px; }

/* Book wrap */
.book-wrap {
  position: relative;
  width: min(310px, 86vw);
  height: min(390px, calc(100vh - 130px));
  filter: drop-shadow(0 30px 60px rgba(0,0,0,0.85));
  z-index: 2;
}

/* Spine */
.book-spine-fixed {
  position: absolute; left: 0; top: 0; bottom: 0; width: 22px; z-index: 10;
  background: linear-gradient(to right, #120701, #3d200a, #261205);
  border-radius: 6px 0 0 6px; border-right: 1px solid #5a3010;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.15s ease;
}
.book-spine-fixed.anim-hidden { opacity: 0; }

/* Cover panel */
.book-cover-panel {
  position: absolute; left: 22px; top: 0;
  width: calc(100% - 22px); height: 100%;
  transform-style: preserve-3d;
  transform-origin: left center;
  transform: rotateY(0deg);
  transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1.000);
  z-index: 5; perspective: 1400px;
}
.book-cover-panel.opening { transform: rotateY(-174deg); }

.book-cover-face {
  position: absolute; inset: 0;
  background: linear-gradient(155deg, #3d2008 0%, #2a1405 55%, #1a0d03 100%);
  border-radius: 0 8px 8px 0; border: 1px solid #5a3010; border-left: none;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
.book-cover-face::before {
  content: ''; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
}

.book-cover-inner {
  position: absolute; inset: 0;
  background: linear-gradient(155deg, #2a1405 0%, #1a0d03 100%);
  border-radius: 0 8px 8px 0; border: 1px solid #5a3010; border-left: none;
  overflow: hidden; display: none; z-index: 2;
}
.book-cover-inner.show { display: block; }

.book-pages {
  position: absolute; right: 0; top: 3px; bottom: 3px; width: 12px; z-index: 4;
  border-radius: 0 6px 6px 0;
  background: linear-gradient(to right, #c8b48a, #ede0c4 25%, #f5ead4 55%, #e8d8b8 100%);
  box-shadow: inset -1px 0 3px rgba(0,0,0,0.08), inset 1px 0 4px rgba(0,0,0,0.12);
  overflow: hidden; transition: opacity 0.2s ease;
}
.book-pages::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2.5px, rgba(180,150,100,0.12) 2.5px, rgba(180,150,100,0.12) 3px);
}

/* Spread */
.book-spread {
  position: absolute; left: 0; top: 0; right: 12px; bottom: 0;
  display: flex; z-index: 2; border-radius: 6px; overflow: hidden;
}

.spread-cover-strip {
  width: 22px;
  background: linear-gradient(160deg, #3a1e07 0%, #221003 100%);
  flex-shrink: 0; position: relative;
}
.spread-cover-strip::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 10px;
  background: linear-gradient(to right, transparent, rgba(0,0,0,0.4));
}

.spread-paper {
  flex: 1;
  background: linear-gradient(to bottom right, var(--paper-light), var(--paper-dark));
  position: relative; overflow: hidden; display: flex; flex-direction: column;
  border-radius: 0 6px 6px 0;
}
.spread-paper::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(transparent, transparent 28px, var(--rule) 28px, var(--rule) 29px);
  background-position: 0 56px;
}
.spread-paper::after {
  content: ''; position: absolute; left: 36px; top: 0; bottom: 0; width: 1px;
  background: var(--margin-line);
}

.spread-binding-shadow {
  position: absolute; left: 0; top: 0; bottom: 0; width: 18px;
  background: linear-gradient(to right, rgba(0,0,0,0.18), transparent); z-index: 2;
}
.spread-content {
  position: relative; z-index: 3;
  padding: 16px 16px 0 46px;
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
}

.spread-topbar {
  display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0;
}
.btn-settings {
  background: none; border: none; cursor: pointer;
  font-size: 18px; color: var(--ink-light);
  padding: 0 0 0 8px; line-height: 1; transition: color 0.2s; flex-shrink: 0;
}
.btn-settings:hover, .btn-settings.active { color: var(--ink); }

.settings-panel {
  display: none; flex-shrink: 0;
  background: rgba(245,237,218,0.95);
  border: 1px solid rgba(160,120,70,0.2); border-radius: 6px;
  margin-bottom: 10px; overflow: hidden;
}
.settings-panel.open { display: block; }

.settings-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; background: none; border: none;
  padding: 9px 12px; cursor: pointer;
  font-family: 'Lora', serif; font-size: 11px; color: var(--ink); text-align: left;
  transition: background 0.15s;
}
.settings-item:hover { background: rgba(160,100,40,0.08); }
.settings-item-danger { color: rgba(160,50,30,0.7); }
.settings-item-danger:hover { background: rgba(160,50,30,0.08); }
.settings-icon { font-size: 13px; width: 16px; text-align: center; flex-shrink: 0; }
.settings-divider { height: 1px; background: rgba(160,120,70,0.15); margin: 2px 0; }

/* Select mode */
.toc-item.selectable { cursor: pointer; }
.toc-checkbox {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1px solid rgba(160,120,70,0.4);
  background: transparent; flex-shrink: 0;
  display: none; align-items: center; justify-content: center;
  font-size: 10px; color: #7a5030; margin-right: 4px;
}
.select-mode .toc-checkbox { display: flex; }
.toc-item.selected .toc-checkbox { background: rgba(140,80,30,0.15); border-color: rgba(140,80,30,0.5); }
.toc-item.selected .toc-checkbox::after { content: '✓'; }

.spread-header { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; color: var(--ink); letter-spacing: 1px; margin-bottom: 4px; }
.spread-header-sub { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-light); }
.spread-divider { width: 100%; height: 1px; background: linear-gradient(to right, rgba(150,100,50,0.3), transparent); margin: 10px 0; flex-shrink: 0; }

.toc-list { list-style: none; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.toc-list::-webkit-scrollbar { display: none; }
.toc-item { display: flex; align-items: baseline; padding: 6px 0; border-bottom: 1px dotted rgba(160,120,70,0.2); cursor: pointer; transition: background 0.15s; }
.toc-item:hover { background: rgba(160,100,40,0.06); }
.toc-item:last-child { border-bottom: none; }
.toc-num { font-size: 9px; color: var(--ink-light); min-width: 20px; font-style: italic; flex-shrink: 0; }
.toc-date { font-family: 'Playfair Display', serif; font-size: 11px; font-style: italic; color: var(--ink); flex-shrink: 0; min-width: 80px; }
.toc-dots { flex: 1; border-bottom: 1px dotted rgba(160,120,70,0.3); margin: 0 5px; position: relative; top: -3px; }
.toc-preview { font-size: 9px; color: var(--ink-light); font-style: italic; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; }
.toc-empty { font-size: 11px; font-style: italic; color: var(--ink-light); text-align: center; padding: 20px 0; line-height: 1.8; }

.toc-item.pinned { background: rgba(200,150,60,0.07); }
.toc-item.pinned:hover { background: rgba(200,150,60,0.12); }
.toc-pin { font-size: 10px; flex-shrink: 0; margin-left: 3px; line-height: 1; }

.spread-open-btn {
  margin: 0 12px 14px 40px; position: relative; z-index: 3;
  background: rgba(140,80,30,0.1); border: 1px solid rgba(160,100,40,0.25);
  border-radius: 4px; padding: 8px 12px;
  font-family: 'Lora', serif; font-size: 11px; font-style: italic;
  color: #7a5030; cursor: pointer; transition: all 0.2s; text-align: center;
}
.spread-open-btn:hover { background: rgba(140,80,30,0.2); }

.spread-back-btn {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(180,130,60,0.22); font-family: 'Lora', serif;
  background: none; border: none; cursor: pointer; transition: color 0.2s;
  z-index: 2;
}
.spread-back-btn:hover { color: rgba(180,130,60,0.55); }

.cover-tagline { font-size: 11px; color: rgba(180,130,60,0.2); letter-spacing: 4px; text-transform: uppercase; font-family: 'Lora', serif; z-index: 2; }
@keyframes pulse { 0%,100%{opacity:0.28} 50%{opacity:0.65} }

.emboss-outer { position: absolute; inset: 12px; border: 1px solid rgba(180,120,50,0.2); border-radius: 6px; }
.emboss-inner { position: absolute; inset: 19px; border: 1px solid rgba(180,120,50,0.09); border-radius: 4px; }
.cover-ornament { font-size: 15px; color: var(--j-gold-dim); letter-spacing: 8px; position: relative; z-index: 1; }
.cover-title-wrap { text-align: center; padding: 0 28px; position: relative; z-index: 1; }
.cover-title { font-family: 'Playfair Display', serif; font-size: 27px; font-weight: 700; color: var(--j-gold); letter-spacing: 1px; line-height: 1.3; text-shadow: 0 0 40px rgba(200,160,60,0.25); }
.cover-divider { width: 56px; height: 1px; background: linear-gradient(to right, transparent, rgba(200,150,60,0.45), transparent); margin: 12px auto; }
.cover-subtitle { font-family: 'Lora', serif; font-size: 12px; font-style: italic; color: rgba(200,160,80,0.4); letter-spacing: 2px; }
.cover-hint { position: absolute; bottom: 22px; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(180,130,60,0.28); font-family: 'Lora', serif; animation: pulse 2.5s ease-in-out infinite; z-index: 1; }
.spine-text { writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Playfair Display', serif; font-size: 9px; letter-spacing: 3px; color: rgba(200,160,80,0.3); text-transform: uppercase; }

/* Fullscreen journal */
#journal-screen { align-items: stretch; justify-content: stretch; overflow: hidden; }

.page-viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
.journal-page {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom right, var(--paper-light), var(--paper-dark));
  overflow-y: auto; overflow-x: hidden;
  box-shadow: inset 4px 0 16px rgba(0,0,0,0.07);
  will-change: transform;
}
.journal-page::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: repeating-linear-gradient(transparent, transparent 31px, var(--rule) 31px, var(--rule) 32px);
  background-position: 0 100px; z-index: 0;
}

.page-margin { position: fixed; left: 52px; top: 0; bottom: 60px; width: 1px; background: var(--margin-line); pointer-events: none; z-index: 1; }
.page-binding { position: fixed; left: 0; top: 0; bottom: 60px; width: 22px; background: linear-gradient(to right, rgba(0,0,0,0.16), transparent); pointer-events: none; z-index: 2; }

.page-inner { position: relative; z-index: 3; padding: 0 24px 100px 62px; min-height: 100%; }

.page-topbar { display: flex; align-items: center; justify-content: space-between; height: 36px; gap: 8px; padding-top: 16px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

.btn-back-spread {
  background: transparent; border: none; cursor: pointer;
  font-family: 'Lora', serif; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--ink-light); padding: 4px 0; transition: color 0.2s; white-space: nowrap;
}
.btn-back-spread:hover { color: var(--ink); }

.btn-delete-inline {
  background: transparent; border: none; cursor: pointer;
  font-family: 'Lora', serif; font-size: 10px; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(160,70,50,0.3); padding: 4px 0;
  transition: color 0.2s; white-space: nowrap;
}
.btn-delete-inline:hover { color: rgba(160,50,30,0.7); }

.page-indicator { font-size: 10px; letter-spacing: 2px; color: var(--ink-light); white-space: nowrap; }

.btn-new-inline {
  background: rgba(140,80,30,0.08); border: 1px solid rgba(160,100,40,0.2);
  border-radius: 50%; width: 24px; height: 24px;
  color: #8b5a2b; font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.btn-new-inline:hover { background: rgba(140,80,30,0.2); }

textarea {
  width: 100%; min-height: 65vh; background: transparent; border: none; outline: none; resize: none;
  font-family: 'Lora', serif; font-size: 15px; line-height: 32px;
  color: var(--ink); letter-spacing: 0.3px; caret-color: #8b3a1a;
  user-select: text; display: block; padding: 0; margin: 0;
}
textarea::placeholder { color: rgba(100,70,40,0.28); font-style: italic; }

.page-header-fields { display: flex; flex-direction: column; border-bottom: 1px solid rgba(150,100,50,0.18); margin-bottom: 0; }
.entry-date-input {
  background: transparent; border: none; outline: none;
  font-family: 'Playfair Display', serif; font-size: 11px; font-style: italic;
  color: rgba(92,61,30,0.55); letter-spacing: 1px;
  width: 100%; padding: 0; height: 26px; line-height: 26px; margin-top: -2px;
  user-select: text;
}
.entry-title-input {
  background: transparent; border: none; outline: none;
  font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700;
  color: var(--ink); width: 100%; padding: 0; height: 34px; line-height: 34px;
  user-select: text;
}
.entry-title-input::placeholder { color: rgba(100,70,40,0.22); font-weight: 400; font-style: italic; }

.save-dot { position: fixed; top: 20px; right: 50px; z-index: 10; width: 5px; height: 5px; border-radius: 50%; background: rgba(140,100,40,0.4); opacity: 0; transition: opacity 0.3s; }
.save-dot.show { opacity: 1; }

.page-num-fixed { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 11px; font-style: italic; color: rgba(120,80,40,0.28); z-index: 10; pointer-events: none; }
.swipe-hint { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: rgba(120,80,40,0.18); pointer-events: none; z-index: 10; transition: opacity 0.5s; }

.corner-fold { position: fixed; bottom: 60px; right: 0; width: 36px; height: 36px; cursor: pointer; z-index: 20; transition: width 0.3s cubic-bezier(0.34,1.56,0.64,1), height 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.corner-fold::before { content: ''; position: absolute; bottom: 0; right: 0; border-style: solid; border-width: 0 0 36px 36px; border-color: transparent transparent #b8955a transparent; transition: border-width 0.3s cubic-bezier(0.34,1.56,0.64,1); filter: drop-shadow(-2px -2px 4px rgba(0,0,0,0.12)); }
.corner-fold:hover { width: 52px; height: 52px; }
.corner-fold:hover::before { border-width: 0 0 52px 52px; border-color: transparent transparent #a07840 transparent; }

@keyframes slideInRight  { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes slideOutLeft  { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes slideInLeft   { from { transform: translateX(-100%); } to { transform: translateX(0); } }
@keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
.flip-out-forward  { animation: slideOutLeft  0.35s cubic-bezier(0.4,0,0.2,1) forwards; }
.flip-in-forward   { animation: slideInRight  0.35s cubic-bezier(0.4,0,0.2,1) forwards; }
.flip-out-backward { animation: slideOutRight 0.35s cubic-bezier(0.4,0,0.2,1) forwards; }
.flip-in-backward  { animation: slideInLeft   0.35s cubic-bezier(0.4,0,0.2,1) forwards; }
@keyframes fadeInPage { from{opacity:0;transform:scale(0.94) translateY(14px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes fadeOutPage { from{opacity:1} to{opacity:0} }
.fade-in { animation: fadeInPage 0.5s ease forwards; }
.fade-out { animation: fadeOutPage 0.4s ease forwards; }


/* ── Quest Log (habits_log di journal page) ── */
.quest-log {
  margin-top: 20px;
  border-top: 1px solid rgba(150,100,50,0.15);
  padding-top: 14px;
}
.quest-log-title {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(150,100,50,0.5);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.quest-log-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(150,100,50,0.12);
}
.quest-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(150,100,50,0.07);
}
.quest-item:last-child { border-bottom: none; }
.quest-check { font-size: 11px; color: rgba(150,100,50,0.5); margin-top: 1px; flex-shrink: 0; }
.quest-info { flex: 1; }
.quest-name { font-family: 'Lora', serif; font-size: 12px; color: rgba(100,70,40,0.75); line-height: 1.4; }
.quest-cat { font-size: 10px; color: rgba(100,70,40,0.4); font-style: italic; }
.quest-time { font-size: 10px; color: rgba(100,70,40,0.35); white-space: nowrap; margin-top: 1px; }
.quest-log-empty { font-size: 11px; color: rgba(100,70,40,0.3); font-style: italic; padding: 4px 0; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Settings divider */
.settings-divider { height: 1px; background: rgba(160,120,70,0.15); margin: 2px 0; }
/* ══════════════════════════════════════════════════════════════════
   MOOD SYSTEM
══════════════════════════════════════════════════════════════════ */

/* TOC mood indicator — subtle left border */

<script src="/shared/ecosystem-db.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   INDEXEDDB — single DB, two object stores:
     • "entries"  — journal entries  { id, date, title, content, order,
                                       mood, habits_log, source, generatedAt }
     • "kv"       — key-value store  (used for RPG profile cache, etc.)
════════════════════════════════════════════════════════════════════ */
async function dbOpen() {
  return EcosystemDB.open();
}

function dbGetAllEntries() {
  return EcosystemDB.journal.getAll();
}
function dbPutEntry(entry) {
  return EcosystemDB.journal.put(entry);
}
function dbDeleteEntry(id) {
  return EcosystemDB.journal.delete(id);
}
function dbPutAllEntries(arr, clearFirst = true) {
  return EcosystemDB.journal.putAll(arr, clearFirst);
}

/* ════════════════════════════════════════════════════════════════════
   JOURNAL LOGIC
════════════════════════════════════════════════════════════════════ */
const PAGE_CHARS = 900;

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtLong  = d => { try { return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); } catch(e){ return d; } };
const fmtShort = d => { try { return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return d; } };
const genId    = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// In-memory mirror of IndexedDB entries (always sorted newest-first)
let entries = [];

/* ── Shared data rules ──
   Semua app harus baca data lewat helper ini, bukan langsung dari raw store.
*/
function isArchivedRecord(record) {
  return record?.isArchived === true
    || record?.archived === true
    || record?.status === 'archived'
    || Boolean(record?.archivedAt);
}

function toIsoString(value, fallback = undefined) {
  if (typeof value === 'string' && value.trim()) return value;
  if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString();
  if (fallback !== undefined) return fallback;
  return new Date().toISOString();
}

function normalizeHabitLogItem(item) {
  const completedAt = toIsoString(item?.completedAt || item?.doneAt || item?.timestamp);
  return {
    habitName: item?.habitName || item?.name || 'Habit',
    category: item?.category || '',
    completedAt,
  };
}

function normalizeJournalEntry(entry, fallbackOrder = 0) {
  const date = entry?.date || todayStr();
  const createdAt = toIsoString(
    entry?.createdAt || entry?.generatedAt,
    `${date}T00:00:00.000Z`
  );
  const updatedAt = toIsoString(entry?.updatedAt || entry?.modifiedAt || createdAt, createdAt);
  const completedAt = entry?.completedAt ? toIsoString(entry.completedAt, null) : (entry?.generatedAt ? toIsoString(entry.generatedAt, null) : null);
  return {
    id: entry?.id || genId(),
    date,
    title: entry?.title || '',
    content: entry?.content || '',
    order: Number.isFinite(entry?.order) ? entry.order : fallbackOrder,
    mood: entry?.mood ?? null,
    habits_log: Array.isArray(entry?.habits_log) ? entry.habits_log.map(normalizeHabitLogItem) : [],
    source: entry?.source || 'manual',
    generatedAt: entry?.generatedAt || null,
    createdAt,
    updatedAt,
    completedAt,
    archivedAt: entry?.archivedAt || null,
    isArchived: isArchivedRecord(entry),
    pinned: entry?.pinned === true,
  };
}

function normalizeJournalEntries(list) {
  return (Array.isArray(list) ? list : [])
    .map((entry, idx) => normalizeJournalEntry(entry, idx))
    .sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return (b.date || '').localeCompare(a.date || '');
    });
}

function getVisibleEntries(list = entries) {
  return normalizeJournalEntries(list).filter(entry => !isArchivedRecord(entry));
}

function getEntryByDate(dateStr, list = entries) {
  return getVisibleEntries(list).find(entry => entry.date === dateStr) || null;
}

function getTodayJournal(list = entries) {
  return getEntryByDate(todayStr(), list);
}

/* ── Persist helpers ── */
let jSaveAllTimer = null;

// Save a single entry to IDB (debounced for typing)
let jWriteTimer = null;
function jSaveAll() {
  // Re-assign order based on current array position, then persist all
  clearTimeout(jSaveAllTimer);
  jSaveAllTimer = setTimeout(async () => {
    entries.forEach((e, i) => { e.order = i; e.updatedAt = new Date().toISOString(); });
    for (const e of entries) await dbPutEntry(e);
  }, 300);
}

function jSaveAllNow() {
  clearTimeout(jSaveAllTimer);
  entries.forEach((e, i) => { e.order = i; e.updatedAt = new Date().toISOString(); });
  // Fire-and-forget (sync-style callers expect void)
  (async () => { for (const e of entries) await dbPutEntry(e); })();
}

function jSaveEntry(id, fields) {
  const idx = entries.findIndex(e => e.id === id);
  if (idx >= 0) {
    Object.assign(entries[idx], fields, { updatedAt: new Date().toISOString() });
    dbPutEntry(entries[idx]); // persist single entry immediately
  }
}

function jAddEntry() {
  const now = new Date().toISOString();
  const today = todayStr();
  const e = normalizeJournalEntry({
    id: genId(),
    date: today,
    title: '',
    content: '',
    order: 0,
    mood: null,
    habits_log: [],
    source: 'manual',
    generatedAt: null,
    createdAt: now,
    updatedAt: now,
    completedAt: null,
    archivedAt: null,
    isArchived: false,
  });
  entries.unshift(e);
  // Re-sort newest-first and re-assign order
  entries.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  entries.forEach((x, i) => { x.order = i; });
  dbPutEntry(e);
  return e;
}
function jAllEntries() { return getVisibleEntries(entries); }
function jPagesOf(text) {
  if (!text) return [''];
  const chunks = [];
  for (let i = 0; i < text.length; i += PAGE_CHARS) chunks.push(text.slice(i, i+PAGE_CHARS));
  return chunks.length ? chunks : [''];
}

let jCurrentId   = null;
let jCurrentPage = 0;
let jIsFlipping  = false;
let jSaveTimer   = null;
let jPageEl      = null;
let jBookIsOpen  = false;

/* Book swipe (cover/spread) */
let swipeStartX = 0, swipeStartY = 0, swipeLocked = false;

(function setupBookSwipe() {
  const screen = document.getElementById('cover-screen');
  screen.addEventListener('touchstart', e => { swipeStartX = e.touches[0].clientX; swipeStartY = e.touches[0].clientY; swipeLocked = false; }, { passive: true });
  screen.addEventListener('touchend', e => {
    if (swipeLocked) return;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.8) return;
    swipeLocked = true;
    if (!jBookIsOpen && dx < 0) openBook();
    else if (jBookIsOpen && dx < 0) jGoFullscreen(null);
    else if (jBookIsOpen && dx > 0) goToCover();
  }, { passive: true });
  let mStartX = 0, mDrag = false;
  screen.addEventListener('mousedown', e => { mStartX = e.clientX; mDrag = true; });
  screen.addEventListener('mouseup', e => {
    if (!mDrag) return; mDrag = false;
    const dx = e.clientX - mStartX;
    if (!jBookIsOpen && dx < -50) openBook();
    else if (jBookIsOpen && dx < -50) jGoFullscreen(null);
    else if (jBookIsOpen && dx > 50) goToCover();
  });
})();

function openBook() {
  if (jBookIsOpen) return;
  jBookIsOpen = true;
  const coverPanel = document.getElementById('book-cover-panel');
  const coverFace  = coverPanel.querySelector('.book-cover-face');
  const coverInner = coverPanel.querySelector('.book-cover-inner');
  const bookPages  = document.getElementById('book-pages');
  const spine      = document.querySelector('.book-spine-fixed');
  document.getElementById('cover-hint').style.display = 'none';
  spine.classList.add('anim-hidden');
  bookPages.style.transition = 'opacity 0.15s ease';
  bookPages.style.opacity = '0';
  coverInner.classList.remove('show');
  coverFace.style.display = '';
  coverPanel.classList.add('opening');
  setTimeout(() => { coverFace.style.display = 'none'; }, 480);
  setTimeout(() => {
    spine.classList.remove('anim-hidden');
    jRenderSpread();
    document.getElementById('cover-tagline').style.display = 'none';
    document.getElementById('spread-back-btn').style.display = '';
  }, 1000);
}

function goToCover() {
  if (!jBookIsOpen) return;
  jBookIsOpen = false;
  const coverPanel = document.getElementById('book-cover-panel');
  const coverFace  = coverPanel.querySelector('.book-cover-face');
  const coverInner = coverPanel.querySelector('.book-cover-inner');
  const bookPages  = document.getElementById('book-pages');
  const spine      = document.querySelector('.book-spine-fixed');
  spine.classList.add('anim-hidden');
  document.getElementById('cover-tagline').style.display = '';
  document.getElementById('spread-back-btn').style.display = 'none';
  document.getElementById('cover-hint').style.display = '';
  coverFace.style.display = 'none';
  coverInner.classList.add('show');
  coverPanel.classList.remove('opening');
  setTimeout(() => { coverInner.classList.remove('show'); coverFace.style.display = ''; }, 480);
  setTimeout(() => {
    spine.classList.remove('anim-hidden');
    bookPages.style.transition = 'opacity 0.3s ease';
    bookPages.style.opacity = '';
    setTimeout(() => { bookPages.style.transition = ''; }, 300);
  }, 1000);
}

function jRenderSpread() {
  const list = document.getElementById('toc-list');
  list.innerHTML = '';
  const all = jAllEntries();
  if (all.length === 0) {
    list.innerHTML = '<li class="toc-empty">Belum ada lembaran.<br>Buka editor dan tap ✦ untuk mulai ✦</li>';
    return;
  }
  all.forEach((entry, i) => {
    const label   = entry.title || '(tanpa judul)';
    const dateStr = entry.date ? fmtShort(entry.date) : '—';
    const moodStatus = entry.mood?.status || null;
    const moodM = moodStatus ? MOOD_LIST.find(m => m.status === moodStatus) : null;
    const li = document.createElement('li');
    li.className = 'toc-item' + (selectedIds.has(entry.id) ? ' selected' : '') + (entry.pinned ? ' pinned' : '');
    if (moodStatus) li.dataset.mood = moodStatus;
    li.dataset.id = entry.id;
    const moodBadge = moodM ? '<span class="toc-mood" title="' + moodStatus + '">' + moodM.svg + '</span>' : '';
    const pinBadge = entry.pinned ? '<span class="toc-pin" title="Disematkan">📌</span>' : '';
    li.innerHTML = `
      <div class="toc-checkbox"></div>
      <span class="toc-num">${i+1}</span>
      <span class="toc-date">${dateStr}</span>
      <span class="toc-dots"></span>
      <span class="toc-preview">${label}</span>` + pinBadge + moodBadge;
    li.onclick = () => { if (selectMode) toggleSelectItem(entry.id); else jGoFullscreen(entry.id); };

    // Long-press untuk toggle pin (nonaktif saat select mode)
    let lpTimer = null;
    let lpTriggered = false;
    const lpStart = () => {
      if (selectMode) return;
      lpTriggered = false;
      lpTimer = setTimeout(() => {
        lpTriggered = true;
        if (navigator.vibrate) navigator.vibrate(15);
        togglePinEntry(entry.id);
      }, 500);
    };
    const lpCancel = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
    li.addEventListener('pointerdown', lpStart);
    li.addEventListener('pointerup', lpCancel);
    li.addEventListener('pointermove', lpCancel);
    li.addEventListener('pointerleave', lpCancel);
    li.addEventListener('pointercancel', lpCancel);
    // Cegah klik (buka lembaran) langsung setelah long-press berhasil trigger pin
    li.addEventListener('click', (e) => { if (lpTriggered) { e.stopPropagation(); e.preventDefault(); lpTriggered = false; } }, true);

    list.appendChild(li);
  });
  if (selectMode) list.classList.add('select-mode');
}

function togglePinEntry(id) {
  const idx = entries.findIndex(e => e.id === id);
  if (idx < 0) return;
  entries[idx].pinned = !entries[idx].pinned;
  entries[idx].updatedAt = new Date().toISOString();
  dbPutEntry(entries[idx]);
  jRenderSpread();
}

function jGoFullscreen(id) {
  if (!id) {
    const visible = getVisibleEntries(entries);
    if (visible.length === 0) { const e = jAddEntry(); id = e.id; }
    else id = visible[0].id;
  }
  jCurrentId   = id;
  jCurrentPage = 0;
  document.getElementById('cover-screen').classList.add('hidden');
  document.getElementById('journal-screen').classList.remove('hidden');
  jBuildPage(null, 'flip-in-right');
  jSetupSwipe();
  jHideSwipeHintSoon();
}

function jGoToSpread() {
  clearTimeout(jSaveTimer); jFlushSave(); jTeardownSwipe();
  // Bersihkan semua page DOM
  const vp = document.getElementById('page-viewport');
  if (vp) vp.innerHTML = '';
  jPageEl = null;
  document.getElementById('journal-screen').classList.add('hidden');
  document.getElementById('cover-screen').classList.remove('hidden');
  jRenderSpread();
}

function jNewEntry() {
  clearTimeout(jSaveTimer); jFlushSave();
  const e = jAddEntry();
  jCurrentId   = e.id;
  jCurrentPage = 0;
  jBuildPage(jPageEl, 'flip-in-right', 'flip-out-left');
}

function jDeleteEntry() {
  if (!jCurrentId) return;
  const btn = document.querySelector('.btn-delete-inline');
  if (!btn) return;
  if (btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1'; btn.textContent = 'arsip?'; btn.style.color = 'rgba(160,50,30,0.8)';
    setTimeout(() => { btn.dataset.confirm = ''; btn.textContent = 'hapus'; btn.style.color = ''; }, 2500);
    return;
  }
  clearTimeout(jSaveTimer);
  const idx = entries.findIndex(e => e.id === jCurrentId);
  if (idx < 0) return;
  const now = new Date().toISOString();
  entries[idx] = {
    ...entries[idx],
    isArchived: true,
    archivedAt: now,
    updatedAt: now,
  };
  dbPutEntry(entries[idx]);
  const visible = getVisibleEntries(entries);
  if (visible.length === 0) { jGoToSpread(); }
  else {
    const nextIdx = visible.findIndex(e => e.id === jCurrentId);
    const targetIdx = Math.min(Math.max(nextIdx, 0), visible.length - 1);
    jCurrentId   = visible[targetIdx].id;
    jCurrentPage = 0;
    jBuildPage(jPageEl, 'flip-in-left', 'flip-out-right');
  }
}

// ── Quest Log renderer — tampilkan habits_log di journal page ──
function renderQuestLog(habitsLog) {
  if (!Array.isArray(habitsLog) || habitsLog.length === 0) {
    return `<div class="quest-log">
      <div class="quest-log-title">Quest Log</div>
      <div class="quest-log-empty">Belum ada aktivitas tercatat hari ini.</div>
    </div>`;
  }
  const items = habitsLog.map(item => {
    const name = item.habitName || item.name || 'Habit';
    const cat  = item.category || '';
    const time = item.completedAt
      ? new Date(item.completedAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      : '';
    return `<div class="quest-item">
      <span class="quest-check">✦</span>
      <div class="quest-info">
        <div class="quest-name">${name}</div>
        ${cat ? `<div class="quest-cat">${cat}</div>` : ''}
      </div>
      ${time ? `<div class="quest-time">${time}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="quest-log">
    <div class="quest-log-title">Quest Log</div>
    ${items}
  </div>`;
}

function jBuildPage(oldEl, inAnim, outAnim) {
  const vp = document.getElementById('page-viewport');
  const visibleEntries = getVisibleEntries(entries);
  const entry     = visibleEntries.find(e => e.id === jCurrentId) || normalizeJournalEntry({ id: jCurrentId, date: todayStr(), title: '', content: '', mood: null });
  const entryIdx  = visibleEntries.findIndex(e => e.id === jCurrentId);
  const entryNum  = entryIdx + 1;
  const totalEntries = visibleEntries.length;

  // ── CLEANUP: hapus semua page orphan yang tertinggal (anti-glitch) ──
  vp.querySelectorAll('.journal-page:not([data-active])').forEach(el => el.remove());

  if (oldEl) {
    oldEl.removeAttribute('data-active');
    if (outAnim) {
      oldEl.classList.add(outAnim);
      const fsOut = setTimeout(() => { if (oldEl.parentNode) oldEl.remove(); }, 450);
      oldEl.addEventListener('animationend', () => { clearTimeout(fsOut); if (oldEl.parentNode) oldEl.remove(); }, { once: true });
    } else {
      oldEl.remove();
    }
  }

  const currentMood = entry.mood;
  const moodM = currentMood ? MOOD_LIST.find(m => m.status === currentMood.status) : null;
  const moodBtnInner = moodM
    ? moodM.svg + '<span>' + moodM.status + '</span>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9" opacity="0.3"/></svg><span>mood</span>';

  const div = document.createElement('div');
  div.className = 'journal-page';
  div.dataset.active = '1';
  div.innerHTML = `
    <div class="page-inner">
      <div class="page-topbar">
        <div class="topbar-left">
          <button class="btn-back-spread" onclick="jGoToSpread()">← Tutup</button>
          <button class="btn-delete-inline" onclick="jDeleteEntry()">hapus</button>
        </div>
        <div class="topbar-right">
          <button class="btn-mood${moodM ? ' has-mood' : ''}" onclick="openMoodPicker()" title="Pilih mood">${moodBtnInner}</button>
          <span class="page-indicator">${entryNum} / ${totalEntries}</span>
          <button class="btn-new-inline" onclick="jNewEntry()" title="Lembaran baru">+</button>
        </div>
      </div>
      <div class="page-header-fields">
        <input class="entry-title-input" id="entry-title" type="text" placeholder="Judul lembaran..." value="${entry.title||''}" />
        <input class="entry-date-input" id="entry-date" type="date" value="${entry.date || todayStr()}" />
      </div>
      <textarea id="entry-ta" placeholder="Tulis sesuatu...">${entry.content||''}</textarea>
      ${renderQuestLog(entry.habits_log || [])}
    </div>`;

  vp.appendChild(div);
  jPageEl = div;

  if (inAnim) {
    div.classList.add(inAnim);
    const fsIn = setTimeout(() => { div.classList.remove(inAnim); jIsFlipping = false; }, 450);
    div.addEventListener('animationend', () => { clearTimeout(fsIn); div.classList.remove(inAnim); jIsFlipping = false; }, { once: true });
  } else { jIsFlipping = false; }

  const ta     = div.querySelector('textarea');
  const dateI  = div.querySelector('#entry-date');
  const titleI = div.querySelector('#entry-title');
  ta.oninput     = jOnType;
  dateI.oninput  = () => {
    jSaveEntry(jCurrentId, { date: dateI.value });
    // Re-sort entries newest-first after date change
    entries.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    entries.forEach((x, i) => { x.order = i; });
    jRenderSpread();
  };
  titleI.oninput = () => { clearTimeout(jSaveTimer); jSaveTimer = setTimeout(() => { jSaveEntry(jCurrentId, { title: titleI.value }); jRenderSpread(); }, 500); };

function jUpdatePageNum(cur, total) {
  const pi = document.querySelector('.page-indicator');

}

function jFlipForward() {
  if (jIsFlipping) return;
  const visible = getVisibleEntries(entries);
  const idx = visible.findIndex(e => e.id === jCurrentId);
  if (idx >= visible.length - 1) return;
  jIsFlipping = true;
  jCurrentId   = visible[idx + 1].id;
  jCurrentPage = 0;
  const needsFlip = (idx % 2 === 1);
  jBuildPage(jPageEl, needsFlip ? 'flip-in-forward' : null, needsFlip ? 'flip-out-forward' : null);
}

function jFlipBackward() {
  if (jIsFlipping) return;
  const visible = getVisibleEntries(entries);
  const idx = visible.findIndex(e => e.id === jCurrentId);
  if (idx <= 0) return;
  jIsFlipping = true;
  jCurrentId   = visible[idx - 1].id;
  jCurrentPage = 0;
  const needsFlip = (idx % 2 === 0);
  jBuildPage(jPageEl, needsFlip ? 'flip-in-backward' : null, needsFlip ? 'flip-out-backward' : null);
}

/* Swipe in writing mode */
let jTouchStartX = 0, jTouchStartY = 0, jTouchLocked = false, jSwipeCooldown = false;
function jSetupSwipe() {
  const vp = document.getElementById('journal-screen');
  vp.addEventListener('touchstart', jOnTouchStart, { passive: true });
  vp.addEventListener('touchend',   jOnTouchEnd,   { passive: true });
}
function jTeardownSwipe() {
  const vp = document.getElementById('journal-screen');
  vp.removeEventListener('touchstart', jOnTouchStart);
  vp.removeEventListener('touchend',   jOnTouchEnd);
}
function jOnTouchStart(e) { jTouchStartX = e.touches[0].clientX; jTouchStartY = e.touches[0].clientY; jTouchLocked = false; }
function jOnTouchEnd(e) {
  if (jTouchLocked || jIsFlipping || jSwipeCooldown) return;
  const dx = e.changedTouches[0].clientX - jTouchStartX;
  const dy = e.changedTouches[0].clientY - jTouchStartY;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.65) return;
  jTouchLocked = true;
  jSwipeCooldown = true;
  setTimeout(() => { jSwipeCooldown = false; }, 500); // cooldown antar swipe
  if (dx < 0) { jFlipForward(); }
  else {
    const visible = getVisibleEntries(entries);
    const idx = visible.findIndex(e => e.id === jCurrentId);
    if (idx <= 0) jGoToSpread();
    else jFlipBackward();
  }
}

function jOnType() {
  clearTimeout(jSaveTimer);
  document.getElementById('save-dot').classList.add('show');
  jSaveTimer = setTimeout(jFlushSave, 700);
}

function jFlushSave() {
  if (!jPageEl || !jCurrentId) return;
  const ta = jPageEl.querySelector('textarea');
  if (!ta) return;
  const idx = entries.findIndex(e => e.id === jCurrentId);
  if (idx >= 0) {
    entries[idx].content = ta.value;
    dbPutEntry(entries[idx]);
  }
  document.getElementById('save-dot').classList.remove('show');
}

}

function toggleSelectMode() {
  selectMode = !selectMode;
  selectedIds.clear();
  const btn        = document.getElementById('btn-select');
  const delBtn     = document.getElementById('btn-delete-selected');
  const list       = document.getElementById('toc-list');
  const exportBtn  = document.getElementById('btn-export');
  const importBtn  = document.getElementById('btn-import');
  if (selectMode) {
    btn.style.color = 'rgba(140,80,30,0.9)';
    btn.innerHTML = '<span class="settings-icon">☑</span> Mode Pilih: Aktif';
    delBtn.style.display = '';
    list.classList.add('select-mode');
    if (exportBtn) exportBtn.style.display = 'none';
    if (importBtn) importBtn.style.display = 'none';
  } else {
    btn.style.color = '';
    btn.innerHTML = '<span class="settings-icon">☑</span> Pilih Lembaran';
    delBtn.style.display = 'none';
    list.classList.remove('select-mode');

    setTimeout(() => { btn.dataset.confirm = ''; btn.innerHTML = `<span class="settings-icon">✕</span> Hapus Dipilih (<span id="selected-count">${selectedIds.size}</span>)`; }, 2500);
    return;

async function exportData() {
  const data = {
    version: 2,
    entries: normalizeJournalEntries(entries),
    exportedAt: new Date().toISOString(),
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `kronik-backup-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  toggleSettings();
}

function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const parsed = JSON.parse(e.target.result);

      // Terima dua format:
      // 1. Array langsung (export native Kronik)          → [ {...}, ... ]
      // 2. Object wrapper (backup dashboard ecosystemku)  → { entries: [...], profile: {...}, ... }
      let rawEntries;
      if (Array.isArray(parsed)) {
        rawEntries = parsed;
      } else if (parsed && Array.isArray(parsed.entries)) {
        rawEntries = parsed.entries;
      } else {
        throw new Error('Format tidak valid');
      }

      const normalizedImported = normalizeJournalEntries(rawEntries);
      const existingIds = new Set(entries.map(e => e.id));
      const newEntries  = normalizedImported.filter(e => e.id && !existingIds.has(e.id));
      entries = [...newEntries, ...entries].map((e, i) => ({ ...e, order: i, updatedAt: new Date().toISOString() }));
      await dbPutAllEntries(entries);

      jRenderSpread(); toggleSettings();
      alert(`${newEntries.length} lembaran berhasil diimport.`);
    } catch(err) { alert('Gagal import: format file tidak valid.'); }
  };
  reader.readAsText(file); event.target.value = '';
}

// ── Unified habitCompleted handler (window event + BroadcastChannel) ──
async function _onHabitCompleted(detail) {
  // Append to today's habits_log
  try {
    const habitName   = detail.habitName || detail.name || 'Habit';
    const category    = detail.habitCategory || detail.category || '';
    const completedAt = detail.completedAt || new Date().toISOString();
    const today = todayStr();
    let entry = getEntryByDate(today, entries);
    if (!entry) {
      entry = normalizeJournalEntry({
        id: genId(),
        date: today,
        title: '',
        content: '',
        order: 0,
        mood: null,
        habits_log: [],
        source: 'manual',
        generatedAt: null,
        createdAt: completedAt,
        updatedAt: completedAt,
        completedAt: null,
        archivedAt: null,
        isArchived: false,
      });
      entries.unshift(entry);
      entries.forEach((x, i) => { x.order = i; x.updatedAt = completedAt; });
    }
    if (!Array.isArray(entry.habits_log)) entry.habits_log = [];
    // Cegah duplikat kalau event datang dari dua channel sekaligus
    const alreadyLogged = entry.habits_log.some(
      l => l.habitName === habitName && Math.abs(new Date(l.completedAt) - new Date(completedAt)) < 2000
    );
    if (!alreadyLogged) {
      entry.habits_log.push({ habitName, category, completedAt });
      entry.updatedAt = completedAt;
      await dbPutEntry(entry);
    }
  } catch(err) { /* silently ignore */ }
}

// Listen via window event (same-page/same-tab)
window.addEventListener('habitCompleted', (e) => _onHabitCompleted(e.detail || {}));

// Listen via BroadcastChannel (cross-tab, same origin)
try {
  const _bc = new BroadcastChannel('dailyos_events');
  _bc.onmessage = (e) => { if (e.data?.type === 'habitCompleted') _onHabitCompleted(e.data); };
} catch(e) { /* BroadcastChannel tidak tersedia */ }


/* ════════════════════════════════════════════════════════════════════
   BOOT — open IDB, migrate localStorage if needed, then init UI
════════════════════════════════════════════════════════════════════ */
(async function boot() {
  try {
    await dbOpen();
    buildMoodGrid();

    // ── Migrate from old localStorage (buku_jurnal_v3 or v2) ──
    const idbEntries = await dbGetAllEntries();
    if (idbEntries.length === 0) {
      // Try v3 first
      const lsV3 = localStorage.getItem('buku_jurnal_v3');
      if (lsV3) {
        try {
          const parsed = JSON.parse(lsV3);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const normalized = normalizeJournalEntries(parsed).map((e, i) => ({ ...e, order: i }));
            await dbPutAllEntries(normalized);
            entries = normalized;
            localStorage.removeItem('buku_jurnal_v3');
          }
        } catch(e) {}
      }

      // Try v2 if still empty
      if (entries.length === 0) {
        const lsV2 = localStorage.getItem('buku_jurnal_v2');
        if (lsV2) {
          try {
            const oldDb = JSON.parse(lsV2);
            const migrated = Object.keys(oldDb).sort().map((d, i) => normalizeJournalEntry({
              id: genId(),
              date: d,
              title: '',
              content: oldDb[d] || '',
              order: i,
              source: 'manual',
              createdAt: `${d}T00:00:00.000Z`,
              updatedAt: `${d}T00:00:00.000Z`,
              archivedAt: null,
              isArchived: false,
            }, i));
            await dbPutAllEntries(migrated);
            entries = migrated;
            localStorage.removeItem('buku_jurnal_v2');
          } catch(e) {}
        }
      }
    } else {
      entries = normalizeJournalEntries(idbEntries);
    }

  } catch(err) {
    console.error('Kronik boot error:', err);
  } finally {
    // ── Render journal spread — always runs ──
    jRenderSpread();
  }
})();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('[Kronik SW] Registered:', reg.scope))
        .catch(err => console.warn('[Kronik SW] Failed:', err));
    });
  }


</script>
